      // ======================== FEEDBACK + CONTACT INBOX (added) ========================
      async function adminFetch(path, options = {}) {
        return fetch(`${API_URL}${path}`, {
          ...options,
          headers: { "Content-Type": "application/json", ...(options.headers || {}) },
        });
      }

      const inboxState = {
        feedback: { items: [], summary: { new: 0, read: 0, resolved: 0 }, status: "", type: "", error: "" },
        contact: { items: [], summary: { new: 0, read: 0, resolved: 0 }, status: "", type: "", error: "" },
      };
      const FEEDBACK_TYPE_LABELS = {
        general: "General", suggestion: "Suggestion", bug: "Bug / Issue",
        content: "Content", feature: "Feature Request", other: "Other",
      };
      function formatDateTime(value) {
        const d = new Date(value);
        return Number.isNaN(d.getTime()) ? "" : d.toLocaleString("en-IN", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
      }
      function inboxUser(item) {
        const u = item.userId;
        return u && typeof u === "object" ? (u.username ? "@" + u.username : ((u.firstName || "") + " " + (u.lastName || "")).trim()) : "";
      }

      async function renderInbox(kind) {
        const st = inboxState[kind];
        const isFeedback = kind === "feedback";
        document.getElementById("mainPanel").innerHTML =
          `<div class="page-header"><h1>${isFeedback ? "User Feedback" : "Contact Messages"}</h1></div><div style="text-align:center;padding:40px">Loading...</div>`;
        try {
          const qs = new URLSearchParams();
          if (st.status) qs.set("status", st.status);
          if (isFeedback && st.type) qs.set("type", st.type);
          const res = await adminFetch(`/${kind}?${qs.toString()}`);
          const data = await res.json().catch(() => ({}));
          if (!res.ok || !data.success) throw new Error(data.message || "Could not load");
          st.items = data.items;
          st.summary = data.summary;
          st.error = "";
        } catch (err) {
          st.items = [];
          st.error = err.message || "Could not load";
        }
        drawInbox(kind);
      }

      function drawInbox(kind) {
        const st = inboxState[kind];
        const isFeedback = kind === "feedback";
        const total = st.summary.new + st.summary.read + st.summary.resolved;
        const tab = (value, label, count) =>
          `<button class="inbox-tab ${st.status === value ? "active" : ""}" data-status="${value}">${label}<small>${count}</small></button>`;
        const rows = st.items.map((it) => {
          const stars = it.rating ? "★".repeat(it.rating) + "☆".repeat(5 - it.rating) : "—";
          const who = inboxUser(it);
          return `<tr class="${it.status === "new" ? "inbox-new" : ""}">
            <td style="white-space:nowrap;font-size:0.82rem;color:#7a6a5e">${escapeHtml(formatDateTime(it.createdAt))}</td>
            <td><div style="font-weight:700">${escapeHtml(it.name)}</div>
                <div style="font-size:13px;color:#888">${escapeHtml(it.email)}</div>
                ${who ? `<div style="font-size:12px;color:#c16a4b">Member ${escapeHtml(who)}</div>` : ""}</td>
            ${isFeedback
              ? `<td>${escapeHtml(FEEDBACK_TYPE_LABELS[it.feedbackType] || it.feedbackType)}</td><td><span class="inbox-stars">${stars}</span></td>`
              : `<td style="font-weight:600">${escapeHtml(it.subject)}</td>`}
            <td><div class="inbox-snippet">${escapeHtml(it.message)}</div></td>
            <td><span class="status-badge status-${it.status}">${escapeHtml(it.status)}</span>${isFeedback && it.verifyStatus ? `<div class="admin-hint">${it.verifyStatus === "verified" ? "✔ verified · " + escapeHtml(it.verifyKind || "") : escapeHtml(it.verifyStatus)}</div>` : ""}</td>
            <td class="action-group">
              <button class="icon-btn view" data-action="view" data-id="${it._id}"><i class="fa-solid fa-eye"></i> View</button>
              ${it.status !== "read" ? `<button class="icon-btn edit" data-action="read" data-id="${it._id}"><i class="fa-solid fa-envelope-open"></i> Read</button>` : ""}
              ${isFeedback && it.userId ? `<button class="icon-btn unblock" data-action="verify" data-id="${it._id}" title="Count toward badges"><i class="fa-solid fa-circle-check"></i> ${it.verifyStatus === "verified" ? "Verified" : "Verify"}</button>` : ""}
              ${isFeedback && it.verifyStatus ? `<button class="icon-btn edit" data-action="unverify" data-id="${it._id}" title="Clear verification (earned badges stay)"><i class="fa-solid fa-ban"></i> Clear</button>` : ""}
              ${it.status !== "resolved" ? `<button class="icon-btn unblock" data-action="resolved" data-id="${it._id}"><i class="fa-solid fa-check-circle"></i> Resolve</button>` : `<button class="icon-btn edit" data-action="new" data-id="${it._id}"><i class="fa-solid fa-rotate-left"></i> Reopen</button>`}
              <button class="icon-btn delete" data-action="delete" data-id="${it._id}"><i class="fa-solid fa-trash"></i></button>
            </td></tr>`;
        }).join("");
        const cols = isFeedback ? 7 : 6;
        const html = `<div class="page-header"><h1>${isFeedback ? "User Feedback" : "Contact Messages"}</h1></div>
          <div class="inbox-tabs">
            ${tab("", "All", total)}${tab("new", "New", st.summary.new)}${tab("read", "Read", st.summary.read)}${tab("resolved", "Resolved", st.summary.resolved)}
            ${isFeedback ? `<select class="inbox-select" id="inboxType"><option value="">All types</option>${Object.entries(FEEDBACK_TYPE_LABELS).map(([v, l]) => `<option value="${v}" ${st.type === v ? "selected" : ""}>${l}</option>`).join("")}</select>` : ""}
          </div>
          ${st.error ? `<div class="glass-table" style="color:#b25538">⚠ ${escapeHtml(st.error)} <button class="icon-btn view" id="inboxRetry" style="margin-left:10px">Retry</button></div>` : ""}
          <div class="glass-table inbox-wrap"><table><thead><tr><th>Date</th><th>From</th>${isFeedback ? "<th>Type</th><th>Rating</th>" : "<th>Subject</th>"}<th>Message</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody>${rows || `<tr><td colspan="${cols}" style="text-align:center">No ${isFeedback ? "feedback" : "messages"} found</td></tr>`}</tbody></table></div>`;
        document.getElementById("mainPanel").innerHTML = html;

        document.querySelectorAll(".inbox-tab").forEach((b) => b.addEventListener("click", () => { st.status = b.dataset.status; renderInbox(kind); }));
        document.getElementById("inboxType")?.addEventListener("change", (e) => { st.type = e.target.value; renderInbox(kind); });
        document.getElementById("inboxRetry")?.addEventListener("click", () => renderInbox(kind));
        document.querySelectorAll("#mainPanel [data-action]").forEach((btn) =>
          btn.addEventListener("click", () => inboxAction(kind, btn.dataset.action, btn.dataset.id)));
      }

      async function setInboxStatus(kind, id, status) {
        const res = await adminFetch(`/${kind}/${id}/status`, { method: "PATCH", body: JSON.stringify({ status }) });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.success) { showToast(escapeHtml(data.message || "Update failed")); return false; }
        return true;
      }

      async function inboxAction(kind, action, id) {
        const st = inboxState[kind];
        const item = st.items.find((x) => x._id === id);
        if (!item) return;
        try {
          if (action === "view") {
            const isFeedback = kind === "feedback";
            const rows = [
              ["Date", formatDateTime(item.createdAt)], ["Name", item.name], ["Email", item.email],
              ["Account", inboxUser(item) || "Guest"],
              ...(isFeedback ? [["Type", FEEDBACK_TYPE_LABELS[item.feedbackType] || item.feedbackType], ["Rating", item.rating ? item.rating + " / 5" : "Not given"]] : [["Subject", item.subject]]),
              ["Status", item.status],
            ];
            openModal(isFeedback ? "Feedback" : "Contact message",
              `<dl class="inbox-detail">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${escapeHtml(v)}</dd>`).join("")}<dt>Message</dt><dd class="inbox-body">${escapeHtml(item.message)}</dd></dl>`, null);
            if (item.status === "new" && (await setInboxStatus(kind, id, "read"))) { item.status = "read"; st.summary.new--; st.summary.read++; drawInbox(kind); }
            return;
          }
          if (action === "verify" || action === "unverify") {
            let payload = { action: "reset" };
            if (action === "verify") {
              const dflt = item.feedbackType === "suggestion" ? "suggestion" : item.feedbackType === "bug" ? "bug" : "contribution";
              const vkind = (window.prompt("Count this as a verified: suggestion, bug or contribution?\n(Genuine and useful items only — it counts toward badges for the member.)", dflt) || "").trim().toLowerCase();
              if (!vkind) return;
              if (!["suggestion", "bug", "contribution"].includes(vkind)) return showToast("Type must be suggestion, bug or contribution");
              payload = { action: "verify", kind: vkind };
            }
            const res = await adminFetch(`/feedback/${id}/verify`, { method: "PATCH", body: JSON.stringify(payload) });
            const data = await res.json().catch(() => ({}));
            if (!res.ok || !data.success) return showToast(escapeHtml(data.message || "Update failed"));
            showToast(action === "verify" ? (data.newlyUnlocked && data.newlyUnlocked.length ? "Verified — badge awarded" : "Verified") : "Verification cleared");
            return renderInbox(kind);
          }
          if (action === "delete") {
            if (!confirm("Delete this entry permanently?")) return;
            const res = await adminFetch(`/${kind}/${id}`, { method: "DELETE" });
            const data = await res.json().catch(() => ({}));
            if (!res.ok || !data.success) return showToast(escapeHtml(data.message || "Delete failed"));
            showToast("Deleted");
            return renderInbox(kind);
          }
          if (await setInboxStatus(kind, id, action)) { showToast(action === "resolved" ? "Marked resolved" : action === "read" ? "Marked read" : "Reopened"); renderInbox(kind); }
        } catch (err) {
          showToast(escapeHtml(err.message || "Something went wrong"));
        }
      }


      // ======================== XP / BADGES / PROFILE FRAME (new, admin-only) ========================
      // The XP/badge admin API follows the same pattern as every other admin call: no API key, no prompt.
      async function progFetch(path, options = {}) {
        try {
          const response = await fetch(`${API_URL}${path}`, {
            ...options,
            headers: { "Content-Type": "application/json", ...(options.headers || {}) },
          });
          const data = await response.json().catch(() => ({ success: false, message: "Unexpected server response" }));
          return { ok: response.ok && data.success !== false, status: response.status, data };
        } catch (error) {
          return { ok: false, status: 0, data: { success: false, message: "Could not reach the server." } };
        }
      }

      const FRAME_LABELS = { default: "Default", bronze: "Bronze", silver: "Silver", gold: "Gold", special: "Special" };
      const CONDITION_LABELS = {
        xp_threshold: "XP threshold",
        poem_count: "Poems published",
        poem_streak_weeks: "Weekly writing streak",
        manual: "Editorial / admin awarded",
        eligible_poem_count: "Eligible original poems",
        eligible_poem_days: "Eligible poems on distinct days",
        distinct_readers: "Distinct readers of the author's poems",
        reading_days: "Verified reading days",
        poems_read: "Distinct poems read",
        poems_bookmarked: "Distinct poems saved",
        poems_appreciated: "Distinct poems liked",
        verified_suggestions: "Admin-approved suggestions",
        verified_contributions: "Admin-verified contributions",
        verified_bugs: "Admin-verified bug reports",
        early_supporter: "Early supporter (registration cutoff)",
      };
      const AWARD_MODE_LABELS = {
        auto: "Automatic",
        approval: "Needs admin approval",
        config: "Server setting",
        manual: "Manual only",
      };
      const CONDITION_UNITS = {
        eligible_poem_count: "eligible poems", eligible_poem_days: "distinct days with an eligible poem",
        distinct_readers: "distinct readers", reading_days: "reading days", poems_read: "distinct poems read",
        poems_bookmarked: "distinct poems saved", poems_appreciated: "distinct poems liked",
        verified_suggestions: "verified suggestion(s)", verified_contributions: "verified contributions", verified_bugs: "verified bug reports",
      };

      function badgeIconHtml(icon, name) {
        const v = String(icon || "").trim();
        if (/^fa-[a-z0-9-]{1,40}$/.test(v)) return `<i class="fa-solid ${v}"></i>`;
        if (/^https:\/\/[^\s"'<>]{1,300}$/.test(v)) return `<img src="${escapeAttr(v)}" alt="">`;
        return escapeHtml(v.slice(0, 4) || String(name || "?").slice(0, 1));
      }

      function conditionText(b) {
        if (b.conditionType === "manual") return b.key === "sansthapak" ? "Manual only — founder accounts listed in server setting FOUNDER_USER_IDS" : "Editorial / admin selection";
        if (b.conditionType === "early_supporter") return "Account created on/before the server's EARLY_SUPPORTER_CUTOFF";
        if (!b.threshold) return "Invalid condition (ignored)";
        if (b.conditionType === "xp_threshold") return `${b.threshold} XP`;
        if (b.conditionType === "poem_count") return `${b.threshold} poems published`;
        if (b.conditionType === "poem_streak_weeks") return `${b.threshold} consecutive weeks with a poem`;
        if (CONDITION_UNITS[b.conditionType]) return `${b.threshold} ${CONDITION_UNITS[b.conditionType]}`;
        return "Unknown condition";
      }

      function progressText(b) {
        const p = b.progress;
        if (!p) return "Invalid definition — ignored by the engine";
        if (p.manual) return escapeHtml(p.label);
        if (p.binary) return `${escapeHtml(p.label)}: <b>${p.met ? "met" : "not met"}</b>`;
        return `Current: <b>${p.current}</b> ${escapeHtml(p.unit)} · Required: <b>${p.required}</b> · Remaining: <b>${p.remaining}</b>`;
      }

      function fmtDateTime(value) {
        const d = new Date(value);
        return Number.isNaN(d.getTime()) ? "" : d.toLocaleString("en-IN", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
      }

      function historyRowsHtml(items) {
        if (!items.length) return `<tr><td colspan="5" style="text-align:center;color:#888">No XP activity yet</td></tr>`;
        return items.map((t) => `
          <tr>
            <td class="${t.amount > 0 ? "prog-pos" : t.amount < 0 ? "prog-neg" : ""}">${t.amount > 0 ? "+" : ""}${t.amount}</td>
            <td>${escapeHtml(t.eventType)}</td>
            <td>${escapeHtml(t.reason || "—")}${t.referenceId ? `<div class="admin-hint">ref: ${escapeHtml(t.referenceId)}</div>` : ""}</td>
            <td>${escapeHtml(fmtDateTime(t.createdAt))}</td>
            <td>${t.adminId ? escapeHtml(t.adminId) : "—"}</td>
          </tr>`).join("");
      }

      async function openProgression(userId) {
        const { ok, data } = await progFetch(`/progression/users/${encodeURIComponent(userId)}`);
        if (!ok) { showToast(escapeHtml(data.message || "Could not load progression")); return; }
        const u = data.user;
        const name = `${u.firstName || ""} ${u.lastName || ""}`.trim() || u.username || "User";
        const up = data.upcoming;
        const pct = up && up.required ? Math.min(100, Math.round((up.current / up.required) * 100)) : 0;
        const upHtml = up
          ? `<div class="v" style="font-size:20px">${badgeIconHtml(up.icon, up.name)} ${escapeHtml(up.name)}</div>
             <div class="s">${up.unit === "XP"
               ? `Current XP: <b>${up.current}</b><br>Required XP: <b>${up.required}</b><br>Remaining XP: <b>${up.remaining}</b>`
               : `Current: <b>${up.current}</b> ${escapeHtml(up.unit)}<br>Required: <b>${up.required}</b> ${escapeHtml(up.unit)}<br>Remaining: <b>${up.remaining}</b> ${escapeHtml(up.unit)}`}</div>
             <div class="prog-bar"><span style="width:${pct}%"></span></div>`
          : `<div class="s">No automatic badge left to earn. Editorial badges are shown below with their conditions.</div>`;

        const badgesHtml = data.badges.map((b) => {
          const unlocked = b.status === "unlocked";
          const tags = [
            unlocked ? `<span class="prog-tag ok">Unlocked${b.unlockedAt ? " · " + escapeHtml(formatDate(b.unlockedAt)) : ""}${b.source ? " · " + escapeHtml(b.source) : ""}</span>` : b.status === "revoked" ? `<span class="prog-tag warn">Revoked</span>` : `<span class="prog-tag">Locked</span>`,
            b.active ? "" : `<span class="prog-tag warn">Inactive</span>`,
            b.frameKey ? `<span class="prog-tag">Frame: ${escapeHtml(FRAME_LABELS[b.frameKey] || b.frameKey)}</span>` : "",
            b.awardMode ? `<span class="prog-tag">${escapeHtml(AWARD_MODE_LABELS[b.awardMode] || b.awardMode)}</span>` : "",
          ].join("");
          return `
          <div class="prog-badge ${unlocked ? "" : "locked"} ${b.active ? "" : "inactive"}">
            <div class="head"><span class="ic">${badgeIconHtml(b.icon, b.name)}</span><div><div class="nm">${escapeHtml(b.name)}</div><div class="cd">${escapeHtml(conditionText(b))}</div></div></div>
            <div class="ds">${escapeHtml(b.description || "")}</div>
            <div class="cd">${unlocked ? "" : progressText(b)}</div>
            <div class="tags">${tags}</div>
            <div class="acts">
              ${unlocked
                ? `<button class="prog-mini danger" data-prog="revoke" data-key="${escapeAttr(b.key)}">Revoke</button>`
                : `<button class="prog-mini" data-prog="grant" data-key="${escapeAttr(b.key)}">Grant manually</button>`}
            </div>
          </div>`;
        }).join("");

        openModal(
          `XP & Badges · ${name}`,
          `<div class="admin-prog" data-user="${escapeAttr(userId)}">
            <div class="prog-top">
              <div class="prog-card"><div class="k">Current XP</div><div class="v" id="progXp">${data.xp ?? 0}</div><div class="s">${data.stats.poemCount} poems · best streak ${data.stats.streakWeeks} wk (current ${data.stats.currentStreakWeeks})</div></div>
              <div class="prog-card"><div class="k">Profile frame</div><div class="v" style="font-size:22px">${escapeHtml(FRAME_LABELS[data.profileFrame.key] || data.profileFrame.name)}</div><div class="s">Derived from unlocked badges</div></div>
              <div class="prog-card"><div class="k">Upcoming badge</div>${upHtml}</div>
            </div>

            <div class="prog-section-title"><i class="fa-solid fa-medal"></i> Badges <button class="prog-mini" data-prog="recalc" style="margin-left:auto">Re-evaluate</button></div>
            <div class="prog-badges">${badgesHtml || '<div class="admin-hint">No badge definitions yet.</div>'}</div>

            <div class="prog-section-title"><i class="fa-solid fa-sliders"></i> Manual XP adjustment</div>
            <div class="admin-form-section">
              <div class="prog-adjust">
                <label>Amount <input id="progAmount" type="number" step="1" placeholder="+50 or -20"></label>
                <label>Reason (required) <input id="progReason" maxlength="300" placeholder="Special editorial contribution"></label>
                <button class="btn-primary" type="button" data-prog="adjust">Apply</button>
              </div>
              <span class="admin-hint">Every adjustment is logged with your name, the reason and the time. XP cannot go below 0.</span>
            </div>

            <div class="prog-section-title"><i class="fa-solid fa-clock-rotate-left"></i> XP history <span class="admin-hint" id="progHistCount">(${data.history.total})</span></div>
            <div class="prog-table-wrap"><table class="prog-history"><thead><tr><th>Amount</th><th>Event</th><th>Reason</th><th>Date</th><th>Admin</th></tr></thead><tbody id="progHistBody">${historyRowsHtml(data.history.items)}</tbody></table></div>
            <div style="text-align:center;margin-top:10px">${data.history.total > data.history.items.length ? `<button class="prog-mini" data-prog="more" data-page="2">Load more</button>` : ""}</div>
          </div>`,
          null,
        );

        const root = document.querySelector(".admin-prog");
        let shown = data.history.items.length;
        root.addEventListener("click", async (e) => {
          const btn = e.target.closest("[data-prog]");
          if (!btn) return;
          const action = btn.getAttribute("data-prog");
          if (action === "adjust") {
            const amount = Number(document.getElementById("progAmount").value);
            const reason = document.getElementById("progReason").value.trim();
            if (!Number.isInteger(amount) || amount === 0) return showToast("Enter a non-zero whole number");
            if (reason.length < 3) return showToast("A reason is required");
            btn.disabled = true;
            const res = await progFetch(`/progression/users/${encodeURIComponent(userId)}/xp-adjust`, { method: "POST", body: JSON.stringify({ amount, reason }) });
            btn.disabled = false;
            if (!res.ok) return showToast(escapeHtml(res.data.message || "Adjustment failed"));
            showToast(`XP updated → ${res.data.xp}`);
            openProgression(userId);
          } else if (action === "grant" || action === "revoke") {
            const key = btn.getAttribute("data-key");
            const reason = window.prompt(action === "revoke" ? "Reason for revoking this badge (required):" : "Reason for granting this badge (optional):", "");
            if (reason === null) return;
            if (action === "revoke" && reason.trim().length < 3) return showToast("A reason is required to revoke");
            const res = await progFetch(`/progression/users/${encodeURIComponent(userId)}/badges/${encodeURIComponent(key)}/${action}`, { method: "POST", body: JSON.stringify({ reason: reason.trim() }) });
            if (!res.ok) return showToast(escapeHtml(res.data.message || "Failed"));
            showToast(action === "grant" ? "Badge granted" : "Badge revoked");
            openProgression(userId);
          } else if (action === "recalc") {
            const res = await progFetch(`/progression/users/${encodeURIComponent(userId)}/recalculate`, { method: "POST" });
            if (!res.ok) return showToast(escapeHtml(res.data.message || "Failed"));
            showToast(res.data.newlyUnlocked.length ? `Unlocked: ${res.data.newlyUnlocked.join(", ")}` : "Already up to date");
            openProgression(userId);
          } else if (action === "more") {
            const page = Number(btn.getAttribute("data-page"));
            const res = await progFetch(`/progression/users/${encodeURIComponent(userId)}/xp-history?page=${page}`);
            if (!res.ok) return showToast(escapeHtml(res.data.message || "Failed"));
            document.getElementById("progHistBody").insertAdjacentHTML("beforeend", historyRowsHtml(res.data.items));
            shown += res.data.items.length;
            if (shown >= res.data.total) btn.remove(); else btn.setAttribute("data-page", String(page + 1));
          }
        });
      }

      // ---------- Badge definitions page ----------
      let badgeAdmin = { badges: [], options: null, error: "" };

          document.getElementById("badgeRetryBtn")?.addEventListener("click", () => renderBadgesPage());
          return;
        }
        badgeAdmin = { badges: data.badges, options: data.options, error: "" };

          <div class="glass-table" style="margin-bottom:20px"><b>Special badge settings</b> <span class="admin-hint">(read-only; set in the server environment)</span>

              <tr>
                <td><div style="display:flex;gap:12px;align-items:center"><span class="prog-badge" style="padding:0;border:0;background:none"><span class="ic" style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#c16a4b,#9e4f36);color:#fff;display:inline-flex;align-items:center;justify-content:center;overflow:hidden">${badgeIconHtml(b.icon, b.name)}</span></span><div><div style="font-weight:700">${escapeHtml(b.name)}</div><div class="admin-hint">${escapeHtml(b.key)}</div><div class="admin-hint">${escapeHtml(b.description || "")}</div></div></div></td>

            const res = await progFetch(`/badges/${encodeURIComponent(key)}/active`, { method: "PATCH", body: JSON.stringify({ active: !badge.active }) });
            if (!res.ok) return showToast(escapeHtml(res.data.message || "Failed"));
            showToast(badge.active ? "Badge deactivated" : "Badge activated");

        const res = await progFetch(`/badges/${encodeURIComponent(badge.key)}/holders`);
        if (!res.ok) return showToast(escapeHtml(res.data.message || "Could not load recipients"));
        const rows = (res.data.holders || []).map((h) => `<tr>
          <td>${escapeHtml(((h.firstName || "") + " " + (h.lastName || "")).trim() || "—")}${h.username ? `<div class="admin-hint">@${escapeHtml(h.username)}</div>` : ""}</td>

              <label>Active<select id="bdActive"><option value="true" ${b.active ? "selected" : ""}>Active</option><option value="false" ${b.active ? "" : "selected"}>Inactive</option></select></label>
            </div>
            <label style="margin-top:12px">Description (shown to users)<textarea id="bdDesc" rows="3" maxlength="300">${escapeHtml(b.description || "")}</textarea></label>
          </div>`,
          async () => {
            const payload = {
              name: document.getElementById("bdName").value.trim(),
              description: document.getElementById("bdDesc").value.trim(),
              icon: document.getElementById("bdIcon").value.trim(),
              sortOrder: Number(document.getElementById("bdSort").value),
              conditionType: document.getElementById("bdCond").value,
              threshold: document.getElementById("bdThreshold").value,
              frameKey: document.getElementById("bdFrame").value,
              active: document.getElementById("bdActive").value === "true",
            };
            if (isNew) payload.key = document.getElementById("bdKey").value.trim();
            const res = await progFetch(isNew ? "/badges" : `/badges/${encodeURIComponent(b.key)}`, { method: isNew ? "POST" : "PUT", body: JSON.stringify(payload) });
            if (!res.ok) { showToast(escapeHtml(res.data.message || "Could not save badge")); return false; }
            showToast(isNew ? "Badge created" : "Badge updated");
            renderBadgesPage();

      document.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-action='progression']");
        if (btn) openProgression(btn.getAttribute("data-id"));
      });

      // ======================== DICTIONARY (शब्दकोश) MANAGEMENT ========================
      // New section only. Uses the same admin token wrapper as every other page (all calls go to /api/admin/dictionary).
      const DICT_API = `${API_URL}/dictionary`;
      const dictState = { page: 1, q: "", status: "", total: 0, totalPages: 1, entries: [] };
      const dcInput = "width:100%;padding:11px 14px;border:1px solid #e5d9cf;border-radius:12px;font-size:15px;box-sizing:border-box;font-family:inherit;";
      const dcLabel = "display:block;font-weight:700;margin:14px 0 6px;color:#5c4032;font-size:14px;";
      const dcHelp = "color:#8a7a70;font-size:12px;margin-top:4px;line-height:1.5;";
      const dcLines = (text) => String(text || "").split(/\r?\n/).map((s) => s.trim()).filter(Boolean);
      const dcCommas = (text) => String(text || "").split(/[,\n،]/).map((s) => s.trim()).filter(Boolean);
      const dcJoin = (arr) => (Array.isArray(arr) ? arr.join("\n") : "");

      async function dictJson(url, options) {
        const res = await fetch(url, options);
        let data = {};
        try { data = await res.json(); } catch (e) {}
        return { ok: res.ok, status: res.status, data };
      }

      async function renderDictionaryPage() {
        document.getElementById("mainPanel").innerHTML = `
          <div class="page-header">
            <div>
              <h1>शब्दकोश · Dictionary</h1>
              <p style="color:#7b6f67;margin-top:8px;">हिंदी, उर्दू, Roman और English में शब्द जोड़ें, संपादित करें और प्रकाशित करें।</p>
            </div>
            <div style="display:flex;gap:10px;flex-wrap:wrap;">
              <button class="btn-primary" id="dcNew"><i class="fa-solid fa-plus"></i> नया शब्द</button>
              <button class="btn-primary" id="dcImportToggle" style="background:#7b5a47;"><i class="fa-solid fa-file-csv"></i> CSV Import</button>
              <button class="btn-primary" id="dcExport" style="background:#7b5a47;"><i class="fa-solid fa-download"></i> CSV Export</button>
            </div>
          </div>
          <div id="dcImportPanel" style="display:none;margin-bottom:24px;"></div>
          <div class="glass-table" style="padding:20px;">
            <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;">
              <input id="dcSearch" placeholder="शब्द खोजें (किसी भी लिपि में)…" value="${escapeAttr(dictState.q)}" style="${dcInput}flex:1;min-width:220px;width:auto;" />
              <select id="dcStatus" style="${dcInput}width:auto;">
                <option value="">सभी स्थिति</option>
                <option value="published" ${dictState.status === "published" ? "selected" : ""}>Published</option>
                <option value="draft" ${dictState.status === "draft" ? "selected" : ""}>Draft</option>
              </select>
            </div>
            <div id="dcList" style="overflow-x:auto;"><p style="padding:20px;text-align:center;color:#8a7a70;">Loading…</p></div>
            <div id="dcPager" style="display:flex;justify-content:center;align-items:center;gap:14px;margin-top:16px;"></div>
          </div>`;

        document.getElementById("dcNew").onclick = () => openDictionaryEditor(null);
        document.getElementById("dcExport").onclick = exportDictionaryCsv;
        document.getElementById("dcImportToggle").onclick = () => {
          const p = document.getElementById("dcImportPanel");
          p.style.display = p.style.display === "none" ? "block" : "none";
          if (p.style.display === "block" && !p.innerHTML) renderDictionaryImportPanel();
        };
        let timer;
        document.getElementById("dcSearch").addEventListener("input", (e) => {
          clearTimeout(timer);
          timer = setTimeout(() => { dictState.q = e.target.value.trim(); dictState.page = 1; loadDictionaryList(); }, 300);
        });
        document.getElementById("dcStatus").addEventListener("change", (e) => { dictState.status = e.target.value; dictState.page = 1; loadDictionaryList(); });
        loadDictionaryList();
      }

      async function loadDictionaryList() {
        const box = document.getElementById("dcList");
        if (!box) return;
        const qs = new URLSearchParams({ page: dictState.page, limit: 25 });
        if (dictState.q) qs.set("q", dictState.q);
        if (dictState.status) qs.set("status", dictState.status);
        const { ok, data } = await dictJson(`${DICT_API}?${qs}`);
        if (!ok || !data.success) { box.innerHTML = `<p style="padding:20px;color:#a34f38;">${escapeHtml(data.message || "Could not load the dictionary.")}</p>`; return; }
        dictState.entries = data.entries; dictState.totalPages = data.totalPages; dictState.total = data.total;
        box.innerHTML = data.entries.length
          ? `<table style="width:100%;"><thead><tr><th>शब्द</th><th>Urdu</th><th>Roman</th><th>English</th><th>Status</th><th>Updated</th><th>Actions</th></tr></thead><tbody>${data.entries.map((e) => `
              <tr>
                <td style="font-weight:700;font-size:17px;">${escapeHtml(e.canonicalWord)}${e.featured ? ' <i class="fa-solid fa-star" title="Featured" style="color:#c16a4b;font-size:12px;"></i>' : ""}<div style="font-weight:400;font-size:12px;color:#8a7a70;">/dictionary/${escapeHtml(e.slug)}</div></td>
                <td dir="rtl" style="font-size:18px;">${escapeHtml((e.variants?.urdu || [])[0] || "")}</td>
                <td>${escapeHtml((e.variants?.roman || []).slice(0, 2).join(", "))}</td>
                <td>${escapeHtml((e.englishTranslations || []).slice(0, 3).map((t) => t.term).join(", "))}</td>
                <td><span style="padding:4px 12px;border-radius:30px;font-size:12px;font-weight:700;${e.status === "published" ? "background:#e3f3e8;color:#2f7d4a;" : "background:#eee7e1;color:#6f5b4e;"}">${escapeHtml(e.status)}</span></td>
                <td style="white-space:nowrap;">${formatDate(e.updatedAt)}</td>
                <td style="white-space:nowrap;">
                  <button class="btn-primary" style="padding:7px 14px;font-size:13px;" data-dc-edit="${escapeAttr(e._id)}"><i class="fa-solid fa-pen"></i> Edit</button>
                  <button class="btn-primary" style="padding:7px 14px;font-size:13px;background:#7b5a47;" data-dc-toggle="${escapeAttr(e._id)}" data-status="${e.status === "published" ? "draft" : "published"}">${e.status === "published" ? "Unpublish" : "Publish"}</button>
                  <button class="btn-primary" style="padding:7px 14px;font-size:13px;background:#a33a2f;" data-dc-del="${escapeAttr(e._id)}" data-word="${escapeAttr(e.canonicalWord)}"><i class="fa-solid fa-trash"></i></button>
                </td>
              </tr>`).join("")}</tbody></table>`
          : `<p style="padding:30px;text-align:center;color:#8a7a70;">कोई शब्द नहीं मिला। “नया शब्द” से जोड़ें या CSV import करें।</p>`;
        const pager = document.getElementById("dcPager");
        pager.innerHTML = data.totalPages > 1
          ? `<button class="btn-primary" id="dcPrev" ${dictState.page <= 1 ? "disabled style='opacity:.5'" : ""}>‹</button><span>Page ${dictState.page} / ${data.totalPages} · ${data.total} words</span><button class="btn-primary" id="dcNext" ${dictState.page >= data.totalPages ? "disabled style='opacity:.5'" : ""}>›</button>`
          : `<span style="color:#8a7a70;">${data.total} word${data.total === 1 ? "" : "s"}</span>`;
        const prev = document.getElementById("dcPrev"), next = document.getElementById("dcNext");
        if (prev) prev.onclick = () => { if (dictState.page > 1) { dictState.page--; loadDictionaryList(); } };
        if (next) next.onclick = () => { if (dictState.page < dictState.totalPages) { dictState.page++; loadDictionaryList(); } };
        box.querySelectorAll("[data-dc-edit]").forEach((b) => (b.onclick = () => openDictionaryEditor(b.dataset.dcEdit)));
        box.querySelectorAll("[data-dc-toggle]").forEach((b) => (b.onclick = async () => {
          const r = await dictJson(`${DICT_API}/${b.dataset.dcToggle}/status`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ status: b.dataset.status }) });
          showToast(r.ok ? (b.dataset.status === "published" ? "Published" : "Unpublished") : escapeHtml(r.data.message || "Failed"));
          loadDictionaryList();
        }));
        box.querySelectorAll("[data-dc-del]").forEach((b) => (b.onclick = async () => {
          if (!confirm(`“${b.dataset.word}” को हमेशा के लिए हटाएँ?`)) return;
          const r = await dictJson(`${DICT_API}/${b.dataset.dcDel}`, { method: "DELETE" });
          showToast(r.ok ? "Deleted" : escapeHtml(r.data.message || "Failed"));
          loadDictionaryList();
        }));
      }

      // ---------- CSV import / export ----------
      function renderDictionaryImportPanel() {
        document.getElementById("dcImportPanel").innerHTML = `
          <div class="glass-table" style="padding:22px;">
            <h2 style="font-family:Georgia,serif;color:#5b3b2e;margin:0 0 6px;">CSV से शब्द import करें</h2>
            <p style="${dcHelp}">UTF-8 CSV (Excel / Google Sheets से सेव की हुई)। पहले “Validate” चलाएँ — उससे कुछ भी save नहीं होता। Template: backend की <code>data/dictionary-template.csv</code>।</p>
            <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:14px;">
              <input type="file" id="dcFile" accept=".csv,text/csv" />
              <select id="dcMode" style="${dcInput}width:auto;"><option value="create">नए शब्द जोड़ें (मौजूदा skip)</option><option value="upsert">मौजूदा को update करें</option></select>
              <select id="dcDefStatus" style="${dcInput}width:auto;"><option value="draft">खाली status = Draft</option><option value="published">खाली status = Published</option></select>
              <label style="font-size:14px;"><input type="checkbox" id="dcSkipInvalid" /> गलत rows छोड़कर बाकी import करें</label>
            </div>
            <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;">
              <button class="btn-primary" id="dcValidate" style="background:#7b5a47;"><i class="fa-solid fa-vial"></i> Validate (dry run)</button>
              <button class="btn-primary" id="dcRunImport"><i class="fa-solid fa-upload"></i> Import</button>
            </div>
            <div id="dcImportReport" style="margin-top:16px;"></div>
          </div>`;
        const run = async (dryRun) => {
          const file = document.getElementById("dcFile").files[0];
          const out = document.getElementById("dcImportReport");
          if (!file) { out.innerHTML = `<p style="color:#a34f38;">पहले CSV file चुनें।</p>`; return; }
          if (!dryRun && !confirm("Import शुरू करें? (पहले Validate चलाना बेहतर है)")) return;
          out.innerHTML = "Working…";
          const text = await file.text(); // UTF-8, so Hindi / Urdu survive
          const qs = new URLSearchParams({ mode: document.getElementById("dcMode").value, defaultStatus: document.getElementById("dcDefStatus").value });
          if (dryRun) qs.set("dryRun", "1");
          if (document.getElementById("dcSkipInvalid").checked) qs.set("skipInvalid", "1");
          const { data } = await dictJson(`${DICT_API}/import?${qs}`, { method: "POST", headers: { "Content-Type": "text/csv" }, body: text });
          if (!data.report) { out.innerHTML = `<p style="color:#a34f38;">${escapeHtml(data.message || "Import failed")}</p>`; return; }
          renderImportReport(data.report);
          if (!dryRun && data.report.written) loadDictionaryList();
        };
        document.getElementById("dcValidate").onclick = () => run(true);
        document.getElementById("dcRunImport").onclick = () => run(false);
      }

      function renderImportReport(r) {
        const t = r.totals;
        const color = { create: "#2f7d4a", update: "#1f6aa5", "skip-existing": "#8a7a70", invalid: "#a33a2f" };
        document.getElementById("dcImportReport").innerHTML = `
          ${r.fileErrors.map((e) => `<p style="color:#a33a2f;font-weight:700;">${escapeHtml(e)}</p>`).join("")}
          ${r.fileWarnings.map((e) => `<p style="color:#8a6a1f;">${escapeHtml(e)}</p>`).join("")}
          <p style="font-weight:700;color:#5b3b2e;">${r.dryRun ? "DRY RUN — कुछ save नहीं हुआ. " : ""}Rows ${t.rows} · नए ${t.created} · updated ${t.updated} · skipped ${t.skippedExisting} · invalid ${t.invalid}${r.blocked ? " — import रोका गया (गलत rows ठीक करें)" : ""}</p>
          ${t.drafts && !r.dryRun ? `<p style="${dcHelp}">${t.drafts} row(s) Draft के रूप में saved हैं; status “published” करने पर ही public दिखेंगे।</p>` : ""}
          <div style="max-height:360px;overflow:auto;"><table style="width:100%;"><thead><tr><th>Row</th><th>शब्द</th><th>Result</th><th>Details</th></tr></thead><tbody>
          ${r.rows.map((x) => `<tr><td>${x.row}</td><td>${escapeHtml(x.word)}</td><td style="color:${color[x.action] || "#333"};font-weight:700;">${escapeHtml(x.action)}</td><td style="font-size:13px;">${x.errors.map((e) => `<div style="color:#a33a2f;">✗ ${escapeHtml(e)}</div>`).join("")}${x.warnings.map((e) => `<div style="color:#8a6a1f;">! ${escapeHtml(e)}</div>`).join("")}</td></tr>`).join("")}
          </tbody></table></div>`;
      }

      async function exportDictionaryCsv() {
        const res = await fetch(`${DICT_API}/export`);
        if (!res.ok) { showToast("Export failed"); return; }
        const blob = await res.blob();
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "mehfil-dictionary.csv";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      }

      // ---------- editor ----------

        const ex = m.examples || [];
        return `
          <div class="dcMeaning" style="border:1px solid #eaded4;border-radius:16px;padding:16px;margin-top:14px;background:#fffaf6;">

            <label style="${dcLabel}">Part of speech</label><input class="dcMPos" value="${escapeAttr(m.partOfSpeech || "")}" placeholder="संज्ञा (Noun)" style="${dcInput}" />

            <label style="${dcLabel}">اردو معنی</label><textarea class="dcMUrdu" rows="2" dir="rtl" style="${dcInput}">${escapeHtml(m.urdu || "")}</textarea>
            <label style="${dcLabel}">English meaning</label><textarea class="dcMEnglish" rows="2" style="${dcInput}">${escapeHtml(m.english || "")}</textarea>
            <label style="${dcLabel}">उदाहरण वाक्य (एक पंक्ति = एक वाक्य, अधिकतम 5)</label><textarea class="dcMEx" rows="3" style="${dcInput}">${escapeHtml(ex.map((x) => x.text).join("\n"))}</textarea>
            <label style="${dcLabel}">उदाहरणों का अनुवाद (वही क्रम, वैकल्पिक)</label><textarea class="dcMExTr" rows="3" style="${dcInput}">${escapeHtml(ex.map((x) => x.translation || "").join("\n"))}</textarea>
          </div>`;

          if (!e.meanings.length) e.meanings = [{}];
        }
        const v = e.variants || {};
        const ta = (idv, label, value, help, extra = "") => `<label style="${dcLabel}">${label}</label><textarea id="${idv}" rows="3" ${extra} style="${dcInput}">${escapeHtml(dcJoin(value))}</textarea>${help ? `<div style="${dcHelp}">${help}</div>` : ""}`;

              <div>${ta("dcHindi", "हिंदी रूप (एक पंक्ति = एक रूप)", v.hindi, "")}</div>

            ${ta("dcLit", "साहित्यिक उदाहरण (एक पंक्ति: पाठ :: रचनाकार :: स्रोत)", (e.literaryExamples || []).map((x) => [x.text, x.author, x.source].filter((s, i) => s || i === 0).join(" :: ")), "केवल सत्यापित उद्धरण लिखें।")}
            <label style="${dcLabel}">शब्द की उत्पत्ति (केवल सत्यापित हो तो)</label><textarea id="dcEty" rows="2" style="${dcInput}">${escapeHtml(e.etymology || "")}</textarea>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 20px;">
              <div><label style="${dcLabel}">Tags (comma से अलग)</label><input id="dcTags" value="${escapeAttr((e.tags || []).join(", "))}" style="${dcInput}" /></div>
              <div><label style="${dcLabel}">Categories (comma से अलग)</label><input id="dcCats" value="${escapeAttr((e.categories || []).join(", "))}" style="${dcInput}" /></div>
            </div>

            <h3 style="margin:26px 0 0;color:#9e4f36;font-family:Georgia,serif;">SEO</h3>
            <label style="${dcLabel}">SEO title <span id="dcTitleCount" style="font-weight:400;color:#8a7a70;"></span></label><input id="dcSeoT" value="${escapeAttr(e.seoTitle || "")}" maxlength="120" placeholder="खाली छोड़ें — शब्द से अपने आप बनेगा" style="${dcInput}" />
            <label style="${dcLabel}">SEO description <span id="dcDescCount" style="font-weight:400;color:#8a7a70;"></span></label><textarea id="dcSeoD" rows="2" maxlength="300" placeholder="खाली छोड़ें — अर्थ से अपने आप बनेगा" style="${dcInput}">${escapeHtml(e.seoDescription || "")}</textarea>

            <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:26px;">
              <button class="btn-primary" id="dcSave"><i class="fa-solid fa-floppy-disk"></i> Save</button>
              <button class="btn-primary" id="dcPreviewBtn" style="background:#7b5a47;"><i class="fa-solid fa-eye"></i> Preview</button>
            </div>
            <div id="dcPreview" style="margin-top:22px;"></div>
          </div>`;

        const $ = (x) => document.getElementById(x);
        $("dcBack").onclick = renderDictionaryPage;
        const renumber = () => document.querySelectorAll(".dcMNum").forEach((n, i) => (n.textContent = i + 1));
        const wireMeaning = (root) => { root.querySelector(".dcMRemove").onclick = () => { root.remove(); renumber(); }; };
        document.querySelectorAll(".dcMeaning").forEach(wireMeaning);
        $("dcAddMeaning").onclick = () => {
          if (document.querySelectorAll(".dcMeaning").length >= 10) { showToast("अधिकतम 10 अर्थ"); return; }
          const wrap = document.createElement("div");
          wrap.innerHTML = dcMeaningBlock({}, document.querySelectorAll(".dcMeaning").length);
          const node = wrap.firstElementChild; $("dcMeanings").appendChild(node); wireMeaning(node);
        };
        const counters = () => {
          $("dcTitleCount").textContent = `(${$("dcSeoT").value.length}/65 अनुशंसित)`;
          $("dcDescCount").textContent = `(${$("dcSeoD").value.length}/160 अनुशंसित)`;
        };
        $("dcSeoT").addEventListener("input", counters); $("dcSeoD").addEventListener("input", counters); counters();

        // Duplicate hint while typing the canonical word.
        let dupTimer;
        const checkDup = () => {
          clearTimeout(dupTimer);
          dupTimer = setTimeout(async () => {
            const w = $("dcWord").value.trim(); const box = $("dcDup");
            if (!w) { box.innerHTML = ""; return; }
            const qs = new URLSearchParams({ word: w, language: $("dcLang").value }); if (id) qs.set("excludeId", id);
            const { data } = await dictJson(`${DICT_API}/check?${qs}`);
            if (data.duplicate) box.innerHTML = `<span style="color:#a33a2f;font-weight:700;">⚠ यह शब्द पहले से मौजूद है: ${escapeHtml(data.duplicate.canonicalWord)} (/dictionary/${escapeHtml(data.duplicate.slug)}) — नया पन्ना नहीं बनेगा।</span>`;
            else if ((data.similar || []).length) box.innerHTML = `<span style="color:#8a6a1f;">ध्यान दें: यह शब्द पहले से इन प्रविष्टियों की वर्तनी में है: ${data.similar.map((s) => escapeHtml(s.canonicalWord)).join(", ")}</span>`;
            else box.innerHTML = `<span style="color:#2f7d4a;">✓ नया शब्द</span>`;
          }, 350);
        };
        $("dcWord").addEventListener("input", checkDup); $("dcLang").addEventListener("change", checkDup);

        const collect = () => ({
          canonicalWord: $("dcWord").value.trim(),
          language: $("dcLang").value,
          ...($("dcSlug").value.trim() ? { slug: $("dcSlug").value.trim() } : {}),
          status: $("dcPub").value,
          featured: $("dcFeat").checked,
          pronunciation: $("dcPron").value.trim(),
          partOfSpeech: dcCommas($("dcPos").value),
          variants: { hindi: dcLines($("dcHindi").value), urdu: dcLines($("dcUrdu").value), roman: dcLines($("dcRoman").value), aliases: dcLines($("dcAlias").value) },
          englishTranslations: dcLines($("dcEng").value),
          meanings: [...document.querySelectorAll(".dcMeaning")].map((n) => {
            const ex = dcLines(n.querySelector(".dcMEx").value); const tr = String(n.querySelector(".dcMExTr").value).split(/\r?\n/).map((s) => s.trim());
            return { partOfSpeech: n.querySelector(".dcMPos").value.trim(), hindi: n.querySelector(".dcMHindi").value.trim(), urdu: n.querySelector(".dcMUrdu").value.trim(), english: n.querySelector(".dcMEnglish").value.trim(), examples: ex.map((text, i) => ({ text, translation: tr[i] || "" })) };
          }),
          synonyms: dcLines($("dcSyn").value), antonyms: dcLines($("dcAnt").value), relatedWords: dcLines($("dcRel").value),
          literaryExamples: dcLines($("dcLit").value).map((l) => { const [text, author, source] = l.split("::").map((s) => s.trim()); return { text: text || "", author: author || "", source: source || "" }; }),
          etymology: $("dcEty").value.trim(), tags: dcCommas($("dcTags").value), categories: dcCommas($("dcCats").value),
          seoTitle: $("dcSeoT").value.trim(), seoDescription: $("dcSeoD").value.trim(),
        });

        $("dcPreviewBtn").onclick = () => {
          const d = collect(); const chips = (a, cls = "") => (a || []).map((x) => `<span style="display:inline-block;margin:3px 6px 3px 0;padding:4px 12px;border-radius:30px;background:#f6ece3;color:#9e4f36;${cls}">${escapeHtml(x)}</span>`).join("");
          $("dcPreview").innerHTML = `
            <div style="border:2px dashed #d8b9aa;border-radius:20px;padding:22px;background:#fffdf8;">
              <div style="color:#8a7a70;font-size:12px;margin-bottom:8px;">PREVIEW — public पन्ने जैसा (Status: ${escapeHtml(d.status)})</div>
              <div style="display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center;">
                <div style="font-size:44px;font-weight:700;color:#5a321c;font-family:'Noto Serif Devanagari',serif;">${escapeHtml(d.canonicalWord || "—")}</div>
                <div dir="rtl" style="font-size:38px;color:#9e4f36;">${escapeHtml((d.variants.urdu || [])[0] || "")}</div>
              </div>
              <div>${chips((d.englishTranslations || []).map((t) => t), "font-family:sans-serif;")}</div>
              ${d.pronunciation ? `<div style="color:#7b6f67;margin-top:6px;">उच्चारण: ${escapeHtml(d.pronunciation)}</div>` : ""}
              ${d.meanings.map((m, i) => `<div style="margin-top:16px;"><b>${i + 1}.</b> ${escapeHtml(m.hindi || m.english || m.urdu || "")} <i style="color:#8a7a70;">${escapeHtml(m.partOfSpeech)}</i>${m.hindi && m.english ? `<div style="color:#5c4a3f;">${escapeHtml(m.english)}</div>` : ""}${m.hindi && m.urdu ? `<div dir="rtl" style="color:#5c4a3f;">${escapeHtml(m.urdu)}</div>` : ""}${m.examples.map((x) => `<div style="margin:8px 0 0;padding:6px 12px;border-left:3px solid #e8c8ba;">${escapeHtml(x.text)}${x.translation ? `<div style="color:#8a7a70;font-size:13px;">${escapeHtml(x.translation)}</div>` : ""}</div>`).join("")}</div>`).join("")}
              ${d.synonyms.length ? `<div style="margin-top:16px;"><b>पर्यायवाची:</b> ${chips(d.synonyms)}</div>` : ""}
              ${d.antonyms.length ? `<div style="margin-top:8px;"><b>विलोम:</b> ${chips(d.antonyms)}</div>` : ""}
              ${d.relatedWords.length ? `<div style="margin-top:8px;"><b>संबंधित:</b> ${chips(d.relatedWords)}</div>` : ""}
              <div style="margin-top:18px;padding-top:12px;border-top:1px dashed #e5d9cf;color:#7b6f67;font-size:13px;"><b>Google title:</b> ${escapeHtml(d.seoTitle || `${d.canonicalWord} का अर्थ${d.variants.urdu.length ? ", Urdu Meaning" : ""}${d.englishTranslations.length ? (d.variants.urdu.length ? " & " : ", ") + "English Translation" : ""}`)} | Mehfil</div>
            </div>`;
          $("dcPreview").scrollIntoView({ behavior: "smooth", block: "nearest" });
        };

        $("dcSave").onclick = async () => {
          const btn = $("dcSave"); const msg = $("dcMsg"); btn.disabled = true; msg.innerHTML = "";
          const payload = collect();
          if (id && !payload.slug) delete payload.slug;
          const r = await dictJson(id ? `${DICT_API}/${id}` : DICT_API, { method: id ? "PUT" : "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
          btn.disabled = false;
          if (!r.ok) {
            const list = r.data.errors && r.data.errors.length > 1 ? `<ul style="margin:6px 0 0 18px;">${r.data.errors.map((x) => `<li>${escapeHtml(x)}</li>`).join("")}</ul>` : "";
            msg.innerHTML = `<div style="background:#fdecea;color:#a33a2f;padding:12px 16px;border-radius:12px;font-weight:600;">${escapeHtml(r.data.message || "Save failed")}${list}</div>`;
            msg.scrollIntoView({ behavior: "smooth", block: "nearest" });
            return;
          }
          showToast(id ? "Saved" : "Created");
          const saved = r.data.entry;
          await openDictionaryEditor(saved._id);
          const notes = [...(r.data.warnings || []), ...((r.data.similar || []).map((s) => `ध्यान दें: यह शब्द “${s.canonicalWord}” की वर्तनी में भी है।`))];
          if (notes.length) document.getElementById("dcMsg").innerHTML = `<div style="background:#fff7e0;color:#7a5200;padding:12px 16px;border-radius:12px;">${notes.map((n) => `<div>${escapeHtml(n)}</div>`).join("")}</div>`;
        };
      }

      let currentPage = "dashboard";
      function loadPage(page) {
        currentPage = page;
        if (page === "dashboard") renderDashboard();
        else if (page === "poems") renderPoems();
        else if (page === "sher") renderSherPage();
        else if (page === "lafz") renderLafzPage();
        else if (page === "dictionary") renderDictionaryPage();
        else if (page === "weeklyWriter") renderWeeklyWriterPage();
        else if (page === "thursdayWriter") renderThursdayWriterPage();
        else if (page === "selectedPoem") renderSelectedPoemPage();
        else if (page === "users") renderUsers();
        else if (page === "badges") renderBadgesPage();
        else if (page === "feedback") renderInbox("feedback");
        else if (page === "contact") renderInbox("contact");
        else if (page === "settings") renderSettings();
        document.querySelectorAll(".menu a").forEach((link) => {
          if (link.getAttribute("data-page") === page)
            link.classList.add("active");
          else link.classList.remove("active");
        });
      }

      async function startAdminPanel() {
        await loadUsers();
        await loadPoems();
        loadPage("dashboard");
      }

      // Nothing loads until the server confirms a valid admin token.
      (async () => {
        if (getAdminToken()) {
          try {
            const res = await fetch(`${API_URL}/verify`);
            if (res.ok) { hideAdminLogin(); return startAdminPanel(); }
          } catch (e) {
            return showAdminLogin("Could not reach the server. Please try again.");
          }
        }
        showAdminLogin("");
      })();

      document.getElementById("adminLoginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = document.getElementById("adminLoginBtn");
        const errBox = document.getElementById("adminLoginError");
        btn.disabled = true; errBox.textContent = "";
        try {
          const res = await fetch(`${API_URL}/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              email: document.getElementById("adminEmail").value,
              password: document.getElementById("adminPassword").value,
            }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || !data.token) { errBox.textContent = data.message || "Login failed."; return; }
          setAdminToken(data.token);
          document.getElementById("adminPassword").value = "";
          hideAdminLogin();
          startAdminPanel();
        } catch (err) {
          errBox.textContent = "Could not reach the server. Please try again.";
        } finally { btn.disabled = false; }
      });

      document.querySelectorAll(".menu a").forEach((link) => {
        link.addEventListener("click", (e) => {
          e.preventDefault();
          loadPage(link.getAttribute("data-page"));
        });
      });
    </script>
  </body>
</html>
